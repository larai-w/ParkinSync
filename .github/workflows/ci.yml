name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy credentials so boto3 never reaches real AWS during tests
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      PYTHONPATH: src
      FHIR_VALIDATOR_JAR: ${{ github.workspace }}/.cache/fhir-validator/validator_cli-6.10.0.jar
      FHIR_VALIDATOR_SHA256: fc663ae55dd31bbfde19788dddfb49cacbeebc3c64498fa7b7779df90000434b
      FHIR_VALIDATOR_VERSION: 6.10.0
      NZ_BASE_PACKAGE: fhir.org.nz.ig.base#3.1.0
      JP_CORE_PACKAGE: jpfhir.jp.core#1.2.0
      JP_CORE_PACKAGE_TGZ: ${{ github.workspace }}/.cache/fhir-validator/jpfhir.jp.core-1.2.0.tgz
      JP_CORE_PACKAGE_URL: https://jpfhir.jp/fhir/core/1.2.0/package.tgz
      JP_CORE_PACKAGE_SHA256: 6094c8b9ebd975cb738c66cc999774c06a0aacf4480c068a8465e597117e52a3
      JP_TERMINOLOGY_PACKAGE_TGZ: ${{ github.workspace }}/.cache/fhir-validator/jpfhir-terminology.r4-1.4.0.tgz
      JP_TERMINOLOGY_PACKAGE_URL: https://jpfhir.jp/fhir/core/terminology/jpfhir-terminology.r4-1.4.0.tgz
      JP_TERMINOLOGY_PACKAGE_SHA256: cfeb76457774d5a4bf1eb907cb60d083b0dedf04cb92405effa6b4aeaf68d21f
      JP_TERMINOLOGY_CACHE_ALIAS: /home/runner/.fhir/packages/jpfhir-terminology.r4#1.4.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Java for HL7 Validator CLI
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache HL7 Validator CLI and FHIR packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .cache/fhir-validator
            ~/.fhir/packages
          key: fhir-validator-${{ runner.os }}-6.10.0-r4-4.0.1-nzbase-3.1.0-jpcore-1.2.0

      - name: Install pinned HL7 Validator CLI
        run: |
          mkdir -p "$(dirname "$FHIR_VALIDATOR_JAR")"
          if [ ! -f "$FHIR_VALIDATOR_JAR" ]; then
            curl --fail --location --retry 3 --output "$FHIR_VALIDATOR_JAR" \
              "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${FHIR_VALIDATOR_VERSION}/validator_cli.jar"
          fi
          echo "$FHIR_VALIDATOR_SHA256  $FHIR_VALIDATOR_JAR" | sha256sum --check --strict

      - name: Install pinned JP Core package
        run: |
          mkdir -p "$(dirname "$JP_CORE_PACKAGE_TGZ")"
          if [ ! -f "$JP_CORE_PACKAGE_TGZ" ]; then
            curl --fail --location --retry 3 --output "$JP_CORE_PACKAGE_TGZ" \
              "$JP_CORE_PACKAGE_URL"
          fi
          echo "$JP_CORE_PACKAGE_SHA256  $JP_CORE_PACKAGE_TGZ" | sha256sum --check --strict
          if [ ! -f "$JP_TERMINOLOGY_PACKAGE_TGZ" ]; then
            curl --fail --location --retry 3 --output "$JP_TERMINOLOGY_PACKAGE_TGZ" \
              "$JP_TERMINOLOGY_PACKAGE_URL"
          fi
          echo "$JP_TERMINOLOGY_PACKAGE_SHA256  $JP_TERMINOLOGY_PACKAGE_TGZ" | \
            sha256sum --check --strict
          mkdir -p "$JP_TERMINOLOGY_CACHE_ALIAS"
          tar -xzf "$JP_TERMINOLOGY_PACKAGE_TGZ" -C "$JP_TERMINOLOGY_CACHE_ALIAS"
          test -f "$JP_TERMINOLOGY_CACHE_ALIAS/package/package.json"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-fhir.txt

      - name: Byte-compile Lambda sources
        run: python -m compileall src

      - name: Check public artifacts
        run: python scripts/check_public_artifacts.py

      - name: Check deterministic FHIR R4 artifacts
        run: python scripts/export_synthetic_fhir.py --check

      - name: Check deterministic grounded-summary artifacts
        run: python scripts/generate_grounded_summary.py --check

      - name: Check deterministic seven-day FHIR artifacts
        run: python scripts/generate_weekly_fhir.py --check

      - name: Check deterministic NZ Base derivative artifacts
        run: python scripts/generate_nzbase_fhir.py --check

      - name: Check deterministic JP Core derivative artifacts
        run: python scripts/generate_jpcore_fhir.py --check

      - name: Reproduce P1 mapping-loss counts
        run: python scripts/classify_mapping_loss.py --check

      - name: Validate generated artifacts with HL7 Validator CLI
        run: scripts/validate_fhir_r4.sh

      - name: Validate NZ Base derivative with HL7 Validator CLI
        run: scripts/validate_fhir_nzbase.sh

      - name: Validate JP Core derivative with HL7 Validator CLI
        run: scripts/validate_fhir_jpcore.sh

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  care-event-integration-poc:
    # BEN-001: hold the GutPacer -> care-event-v1 -> ParkinSync integration
    # contract with synthetic data. No dependencies, synthetic data only; no
    # production data and no personal information.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out canonical care-event contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: larai-w/GutPacer-ParkinSync-Module
          path: .contract-source

      - name: Fail on care-event schema drift
        run: |
          python3 poc/gutpacer-parkinsync/test_schema_drift.py
          python3 poc/gutpacer-parkinsync/check_schema_drift.py \
            .contract-source/schema/care-event-v1.schema.json \
            poc/gutpacer-parkinsync/schema/care-event-v1.schema.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: GutPacer -> care-event-v1 -> ParkinSync roundtrip (synthetic)
        run: python3 poc/gutpacer-parkinsync/test_roundtrip.py

      # Medication Promise does not copy the canonical schema; it keeps a
      # narrower medication-only version. Validate it from the consumer side
      # against the canonical one, so a narrowing that drifted is caught every
      # time. This also pins the daily row that mixes two sources, which is the
      # BEN-001 integration itself.
      - name: Medication Promise -> care-event-v1 -> ParkinSync (synthetic)
        run: python3 poc/gutpacer-parkinsync/test_medication_roundtrip.py

      # BEN-001 §7: check that deletion on consent withdrawal, and its
      # verification (re-export and assert absence), still work. The deletion is
      # fail-closed, so running this removes nothing.
      - name: Withdrawal -> deletion -> verification (synthetic)
        run: python3 poc/gutpacer-parkinsync/test_withdraw.py
