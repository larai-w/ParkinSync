# .github/dependabot.yml
version: 2
updates:
  # Target the Python (pip) package management environment
  - package-ecosystem: "pip"
    # Location of the requirements.txt file (root directory)
    directory: "/"
    # Frequency of manifest checks for dependency updates
    schedule:
      interval: "weekly"
    ignore:
      # The FHIR adapter intentionally targets R4.0.1. fhir.resources 8.x requires
      # Pydantic 2 and belongs to a newer package line, so these majors must move
      # together only as an explicit compatibility migration.
      - dependency-name: "fhir.resources"
        update-types: ["version-update:semver-major"]
      # 6.5.0 is a minor release but already models FHIR 4.3.0 (R4B), so the
      # export test rejects it (PR #56). requirements-fhir.txt pins 6.4.0 on purpose.
      - dependency-name: "fhir.resources"
        versions: [">=6.5.0"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
